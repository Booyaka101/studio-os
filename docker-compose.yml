services:
  studio:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - studio-data:/app/data
    environment:
      # Everything is optional — see .env.example. Uncomment what you use.
      #- BASE_URL=https://booking.example.com
      #- APP_SECRET=change-me
      #- SMTP_HOST=smtp.example.com
      #- SMTP_PORT=587
      #- SMTP_USER=user
      #- SMTP_PASS=pass
      #- SMTP_FROM=My Studio <noreply@example.com>
      #- STRIPE_SECRET_KEY=sk_live_...
      #- STRIPE_WEBHOOK_SECRET=whsec_...
      #- STRIPE_PUBLISHABLE_KEY=pk_live_...
    restart: unless-stopped

volumes:
  studio-data:
