name: Feature request
description: Suggest something Studio OS should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Self-hosted. It holds your customers' booking data and talks to your own payment account. Nothing is sent to us.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. What got in your way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead today?
    validations:
      required: false
